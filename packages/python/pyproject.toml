[project]
name = "blackrose"
version = "0.1.0"
description = "TypeSafe decision layer for LLM apps: check_input / check_output → allow | review | block"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dino Kupinic" }]
keywords = ["typesafe", "guardrails", "llm", "safety", "jev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "typesafe-sdk>=0.7.0",
]

[project.urls]
Homepage = "https://blackrose.dev"
Documentation = "https://blackrose.dev"
Repository = "https://github.com/Dino-Kupinic/blackrose"
Changelog = "https://github.com/Dino-Kupinic/blackrose/blob/develop/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackrose"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: hits the real TypeSafe API (requires TYPESAFE_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["blackrose"]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["typesafe_sdk", "typesafe_sdk.*"]
ignore_missing_imports = true
