[project]
name = "blackrose-monorepo"
version = "0.0.0"
description = "Blackrose monorepo — TypeSafe decision layer packages under packages/"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dino Kupinic" }]

# Publishable packages: packages/python (PyPI) and packages/js (npm).
# This root file is workspace metadata and shared tool defaults only.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
