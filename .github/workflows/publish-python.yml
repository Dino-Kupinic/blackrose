name: Publish Python

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the wheel/sdist without uploading"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish from a branch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Publishing requires running this workflow on a v* tag (got $GITHUB_REF)."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest -m "not live"

      - name: Build
        run: uv build

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$PKG"

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: uv publish
