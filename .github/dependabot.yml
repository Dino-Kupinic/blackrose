version: 2
updates:
  # Development happens on develop; main receives it through release merges.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    assignees:
      - "Dino-Kupinic"

  - package-ecosystem: "uv"
    directory: "/packages/python"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    assignees:
      - "Dino-Kupinic"

  - package-ecosystem: "bun"
    directory: "/packages/js"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    ignore:
      # Type definitions must not run ahead of the supported Node floor (engines.node).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]
    assignees:
      - "Dino-Kupinic"

  - package-ecosystem: "bun"
    directory: "/docs"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      docs:
        patterns: ["*"]
    assignees:
      - "Dino-Kupinic"
