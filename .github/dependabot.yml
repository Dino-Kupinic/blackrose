version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Dino-Kupinic"

  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    assignees:
      - "Dino-Kupinic"

  - package-ecosystem: "npm"
    directory: "/packages/js"
    schedule:
      interval: "weekly"
    assignees:
      - "Dino-Kupinic"
